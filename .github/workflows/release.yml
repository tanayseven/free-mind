name: Release

# Push a tag matching the app version (e.g. `v0.1.0` for version 0.1.0 in
# src-tauri/tauri.conf.json) to build every platform and attach the installers
# to a draft GitHub release. Run manually (Actions → Release → Run workflow) to
# build without releasing; installers are then uploaded as workflow artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # A failure on one platform shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          # 22.04 rather than latest: binaries built against an older glibc
          # run on more distros.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            rpm

      - uses: jdx/mise-action@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # npm's cache lives in a different place on Windows.
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: frontend

      # tauri::generate_context! needs the built frontend to compile tests.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Runs the hosts/IPC/daemon tests natively on every platform, which is
      # the only place the Windows and Linux code paths get exercised.
      - name: Test Rust
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the Tauri CLI installed by mise.
          tauriScript: tauri
          args: --target ${{ matrix.target }}
          # Empty on manual runs, so tauri-action only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Free Mind ${{ github.ref_name }}
          releaseBody: See the assets below to download Free Mind for your platform.
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: free-mind-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
