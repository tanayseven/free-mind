name: Release

# Push a tag matching the app version (e.g. `v0.1.0` for version 0.1.0 in
# src-tauri/tauri.conf.json) to build every platform and attach the installers
# to a draft GitHub release. Run manually (Actions → Release → Run workflow) to
# build without releasing; installers are then uploaded as workflow artifacts.
#
# `build` produces everything Tauri can bundle (DMG, DEB, RPM, AppImage, MSI,
# NSIS EXE). `arch` and `msix` then repackage its output into formats Tauri
# doesn't support and add them to the same draft release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # A failure on one platform shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          # 22.04 rather than latest: binaries built against an older glibc
          # run on more distros.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            rpm

      - uses: jdx/mise-action@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # npm's cache lives in a different place on Windows.
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: frontend

      # tauri::generate_context! needs the built frontend to compile tests.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Runs the hosts/IPC/daemon tests natively on every platform, which is
      # the only place the Windows and Linux code paths get exercised.
      - name: Test Rust
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the Tauri CLI installed by mise.
          tauriScript: tauri
          args: --target ${{ matrix.target }}
          # Empty on manual runs, so tauri-action only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Free Mind ${{ github.ref_name }}
          releaseBody: See the assets below to download Free Mind for your platform.
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: free-mind-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/free-mind.exe
          if-no-files-found: error

  # Arch Linux packages (.pkg.tar.gz), repackaged from the Linux .debs.
  arch:
    name: Arch Linux (x64 + ARM64)
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git github-cli

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: free-mind-*-unknown-linux-gnu
          path: artifacts

      - name: Build packages
        run: |
          version=$(sed -n 's/^ *"version": *"\(.*\)",$/\1/p' src-tauri/tauri.conf.json | head -1)
          work=$(mktemp -d)
          cp packaging/arch/PKGBUILD "$work/"
          # Tauri's deb names contain a space; the PKGBUILD expects plain names.
          find artifacts -name '*_amd64.deb' -exec cp {} "$work/free-mind-x86_64.deb" \;
          find artifacts -name '*_arm64.deb' -exec cp {} "$work/free-mind-aarch64.deb" \;
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder "$work"
          # makepkg lets CARCH and PKGEXT be overridden from the environment.
          for arch in x86_64 aarch64; do
            sudo -u builder env -C "$work" CARCH="$arch" PKGVER="$version" PKGEXT=.pkg.tar.gz \
              makepkg --nodeps --force
          done
          mkdir -p dist
          cp "$work"/*.pkg.tar.gz dist/
          ls -l dist

      # Catches libraries missing from the PKGBUILD's depends.
      - name: Smoke test (x64)
        run: |
          pacman -U --noconfirm dist/*-x86_64.pkg.tar.gz
          missing=$(ldd /usr/bin/free-mind | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::Unresolved libraries:"; echo "$missing"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: free-mind-arch
          path: dist/*.pkg.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.pkg.tar.gz --clobber

  # Windows MSIX, packed from the exe the Windows build produced. Unsigned:
  # it needs a code-signing certificate or Microsoft Store submission before
  # users can install it.
  msix:
    name: Windows MSIX (x64)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: free-mind-x86_64-pc-windows-msvc
          path: artifacts

      - name: Pack MSIX
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force layout/Assets, dist | Out-Null
          Get-ChildItem artifacts -Recurse -Filter free-mind.exe | Select-Object -First 1 |
            Copy-Item -Destination layout/
          foreach ($icon in 'Square44x44Logo', 'Square150x150Logo', 'StoreLogo') {
            Copy-Item "src-tauri/icons/$icon.png" layout/Assets/
          }
          # MSIX versions have four parts.
          (Get-Content packaging/msix/AppxManifest.xml -Raw) `
            -replace '\{\{VERSION\}\}', "$version.0" `
            -replace '\{\{PUBLISHER\}\}', 'CN=Tanay PrabhuDesai' |
            Set-Content layout/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe' |
            Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d layout /p "dist/Free Mind_${version}_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: free-mind-msix
          path: dist/*.msix
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.msix --clobber
