name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: frontend

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The browser is cached, but its system libraries are not.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

  rust:
    # Pinned so moving to a new Ubuntu release is a deliberate change.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The runner image (e.g. ubuntu24 / 20261019.1) is part of the apt cache
      # key, so a new image starts a fresh cache.
      - name: Get runner image
        id: image
        run: |
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Only the downloaded .debs are cached; apt-get still installs them
      # normally (and fails loudly). On a warm cache nothing is downloaded, so
      # a slow mirror can't stall the job (one run spent 22 minutes here).
      - name: Cache apt downloads
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-v1
          restore-keys: apt-${{ steps.image.outputs.os }}-

      - name: Install Tauri system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          apt_opts=(-o Acquire::Retries=3 -o APT::Sandbox::User=root
            -o Dir::Cache::Archives="$HOME/apt-archives"
            -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get update "${apt_opts[@]}"
          sudo apt-get install -y "${apt_opts[@]}" \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev
          # Drop superseded .debs so the cache doesn't grow forever.
          sudo apt-get autoclean "${apt_opts[@]}"
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      - uses: jdx/mise-action@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! only needs frontendDist to exist for
      # `cargo check`; the real frontend is built by the frontend job.
      - name: Stub frontend build
        run: mkdir -p frontend/build && echo '<!doctype html>' > frontend/build/index.html

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
